[package]
name = "kasa_server"
version = "0.1.0"
edition = "2024"

[dependencies]
kasa_core = { path = "../kasa_core" }
kasa_python = { path = "../kasa_python" }
axum = { version = "0.8.9", features = ["ws", "macros"] }
clap = { workspace = true, features = ["derive"] }
dotenvy.workspace = true
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tower = "0.5"
tower-http = { workspace = true, features = ["fs", "compression-br"] }
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
sqlite-vec = "0.1.9"
libsqlite3-sys.workspace = true
futures-util = "0.3.33"
serde_json.workspace = true


[lib]
name = "kasa_server"
path = "src/lib.rs"
