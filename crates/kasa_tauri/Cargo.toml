[package]
name = "kasa_tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "kasa_tauri"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
reqwest = { workspace = true, features = ["blocking"] }
tauri-build = { workspace = true, features = [] }
zip = "8.4.0"
zip-extensions = "0.14.1"

# things needed to generate the server schema
# kasa_server = { path = "../kasa_server" }
# tokio = { workspace = true, features = ["full"] }
# progenitor = "0.14.0"
# serde = { workspace = true, features = ["derive"] }
# serde_json = { workspace = true }
# syn = "2.0"
# prettyplease = "0.2.22"

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tauri = { workspace = true, features = ["protocol-asset", "devtools"] }
tauri-plugin-fs = { workspace = true }
tauri-plugin-log = { workspace = true }
tokio = { workspace = true, features = ["full"] }
axum = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
kasa_core = { path = "../kasa_core" }
kasa_python = { path = "../kasa_python" }
#tauri-plugin-theme = "0.4.1"
tauri-plugin-os = { workspace = true }
log = { workspace = true }
dotenvy = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-shell = "2.0.0"

image = { workspace = true }
opener = "0.7.2"
ashpd = { version = "0.6.8", optional = true }
zbus = { version = "5.5.0", features = ["bus-impl"] }
zbus_macros = "5.5.0"
env_logger.workspace = true
sqlite-vec = "0.1.9"
libsqlite3-sys.workspace = true
reqwest = { workspace = true, features = ["brotli", "json"] }
base64.workspace = true
anyhow.workspace = true
serde_urlencoded = "0.7.1"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.33"
tokio-util = "0.7.19"
tauri-plugin-drag = {git = "https://github.com/kaanyalova/drag-rs"}


[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]


[target.'cfg(target_os = "linux")'.dependencies]
ashpd = "0.6.8"


[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[target.x86_64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-Wl,--no-rosegment"]
